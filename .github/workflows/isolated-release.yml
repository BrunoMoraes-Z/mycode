name: isolated-release

# Publishes a GitHub Release with the CLI binaries for every vX.Y.Z tag pushed from the isolated branch.
# The isolated updater (packages/cli/src/services/updater.ts) reads these releases and downloads the asset
# named opencode-<process.platform>-<process.arch>[.exe].
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on the isolated branch
        run: |
          git fetch origin isolated
          git merge-base --is-ancestor "$GITHUB_SHA" origin/isolated || {
            echo "::error::Tag $GITHUB_REF_NAME is not on the isolated branch"
            exit 1
          }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install

      - name: Build binaries
        env:
          OPENCODE_CHANNEL: latest
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          # build target -> updater asset (process.platform-process.arch)
          for pair in windows-x64:win32-x64 windows-arm64:win32-arm64 linux-x64:linux-x64 linux-arm64:linux-arm64 darwin-x64:darwin-x64 darwin-arm64:darwin-arm64; do
            target="${pair%%:*}"
            asset="opencode-${pair##*:}"
            OPENCODE_TARGET="$target" bun run --cwd packages/cli build "--outdir=dist-$target"
            if [[ "$target" == windows-* ]]; then
              cp "packages/cli/dist-$target/cli-$target/bin/opencode.exe" "release/$asset.exe"
            else
              cp "packages/cli/dist-$target/cli-$target/bin/opencode" "release/$asset"
            fi
          done
          (cd release && sha256sum * > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --target "$GITHUB_SHA"
